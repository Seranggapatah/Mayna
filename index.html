<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3c9a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Talking Mouth</title>
<style>
  :root {
    --skin: #f3c9a8;
    --skin-deep: #e9b78f;
    --ink: #3a1620;
    --ink-soft: #7a4a4f;
    --lip: #c8505f;
    --lip-deep: #a93c4c;
    --paper: #fff8f1;
    --glass: rgba(255, 248, 241, 0.86);
    --line: #e3b594;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--skin);
    color: var(--ink);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  /* =================== DESKTOP (default) =================== */
  main {
    width: min(100%, 1440px);
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
    gap: 32px;
    align-items: center;
  }
  .stage { text-align: center; }
  /* Ukuran Rive: selebar kolomnya, tapi tidak lebih tinggi dari 88% layar. */
  #mouth { width: min(100%, 88vh); aspect-ratio: 1; display: block; margin: 0 auto; }
  #viseme {
    display: inline-block;
    margin-top: -12px;
    padding: 4px 14px;
    border-radius: 999px;
    background: var(--skin-deep);
    color: var(--ink-soft);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .panel {
    background: var(--paper);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(82, 20, 32, 0.45);
  }
  h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; }
  .lede { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 132px;
    resize: vertical;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: inherit;
    font: inherit;
  }
  textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(200, 80, 95, 0.4);
    outline-offset: 1px;
    border-color: var(--lip);
  }
  #samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
  #samples button {
    padding: 4px 12px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  #samples button:hover { border-color: var(--lip); color: var(--lip-deep); }
  /* Di desktop pengaturan suara selalu terbuka; judul lipatnya hanya untuk mobile. */
  #settings > summary { display: none; }
  .field { display: grid; grid-template-columns: 92px minmax(0, 1fr) 44px; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .field output { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  select {
    grid-column: 2 / 4;
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: inherit;
    font: inherit;
    font-size: 14px;
  }
  input[type="range"] { width: 100%; accent-color: var(--lip); }
  .check { display: flex; gap: 8px; align-items: center; margin: 4px 0 18px; font-size: 14px; color: var(--ink-soft); }
  .check input { accent-color: var(--lip); width: 16px; height: 16px; }
  .actions { display: flex; gap: 10px; }
  .actions button {
    padding: 12px 22px;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #speak { flex: 1; background: var(--lip); color: #fff; }
  #speak:hover:not(:disabled) { background: var(--lip-deep); }
  #stop { background: var(--skin-deep); color: var(--ink); }
  .actions button:disabled { opacity: 0.45; cursor: default; }
  #greet {
    width: 100%;
    margin-top: 10px;
    padding: 11px 22px;
    border: 1.5px solid var(--lip);
    border-radius: 14px;
    background: transparent;
    color: var(--lip-deep);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #greet:hover:not(:disabled) { background: var(--lip); color: #fff; }
  #greet:disabled { opacity: 0.45; cursor: default; }
  #status { margin: 14px 0 0; min-height: 21px; font-size: 13px; color: var(--ink-soft); }
  #status.error { color: #b3261e; }
  kbd { font: inherit; font-size: 12px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; }

  /* Tombol tampil/sembunyikan panel dan pilihan tampilan: hanya di mobile */
  #toggle, #view { display: none; }

  /* =================== MOBILE =================== */
  @media (max-width: 760px), (orientation: landscape) and (max-height: 520px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { display: block; padding: 0; line-height: 1.4; }
    main { display: block; }

    /* Karakter memenuhi seluruh layar */
    #mouth {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      aspect-ratio: auto;
      touch-action: none;
    }
    #viseme {
      position: fixed;
      z-index: 2;
      top: calc(20px + var(--safe-t));
      left: calc(16px + var(--safe-l));
      margin: 0;
      padding: 5px 12px;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12px;
      transition: opacity 0.25s, transform 0.25s;
    }

    /* Panel kontrol jadi overlay di bawah */
    .panel {
      position: fixed;
      z-index: 2;
      left: calc(10px + var(--safe-l));
      right: calc(10px + var(--safe-r));
      bottom: calc(10px + var(--safe-b));
      max-height: 60dvh;
      overflow-y: auto;
      padding: 14px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 18px 40px -16px rgba(82, 20, 32, 0.5);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1), opacity 0.25s;
    }
    h1, .lede { display: none; }
    textarea { min-height: 0; height: 56px; resize: none; padding: 8px 12px; font-size: 16px; /* 16px: iOS tidak auto-zoom */ }

    #samples { flex-wrap: nowrap; overflow-x: auto; margin: 10px -14px; padding: 0 14px 2px; scrollbar-width: none; }
    #samples::-webkit-scrollbar { display: none; }
    #samples button { padding: 6px 12px; background: rgba(255,255,255,0.5); }

    #settings { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; margin-bottom: 12px; }
    #settings > summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      padding: 6px 2px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
    }
    #settings > summary::-webkit-details-marker { display: none; }
    #settings > summary::after { content: "▾"; transition: transform 0.2s; }
    #settings[open] > summary::after { transform: rotate(180deg); }
    #settings[open] > summary { margin-bottom: 8px; }
    .field { grid-template-columns: 64px minmax(0, 1fr) 40px; }
    .check { margin: 4px 0 8px; }

    .bottom-row { display: flex; gap: 8px; }
    .actions { flex: 1; }
    .actions button { padding: 11px 16px; }
    #greet { width: auto; margin: 0; padding: 11px 14px; }
    #status { margin-top: 8px; min-height: 18px; font-size: 12px; }

    /* Tombol bulat kanan atas */
    #toggle {
      display: grid;
      place-items: center;
      position: fixed;
      z-index: 3;
      top: calc(12px + var(--safe-t));
      right: calc(12px + var(--safe-r));
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: var(--glass);
      color: var(--ink);
      box-shadow: 0 6px 20px -8px rgba(82, 20, 32, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    #toggle:active { transform: scale(0.92); }
    #toggle svg { width: 22px; height: 22px; }
    #toggle .show { display: none; }

    /* Pilihan tampilan: Full body / Close up */
    #view {
      display: flex;
      position: fixed;
      z-index: 3;
      top: calc(16px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      padding: 3px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px -8px rgba(82, 20, 32, 0.5);
      transition: opacity 0.25s, transform 0.25s;
    }
    #view button {
      padding: 6px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    #view button[aria-pressed="true"] { background: var(--lip); color: #fff; }
    /* layar sempit: viseme pindah ke bawah tombol pilihan supaya tidak bertabrakan */
    @media (max-width: 420px) {
      #viseme { top: calc(62px + var(--safe-t)); left: 50%; transform: translateX(-50%); }
      body.hidden-ui #viseme { transform: translate(-50%, -10px); }
    }

    body.hidden-ui #toggle { opacity: 0.55; }
    body.hidden-ui #view { opacity: 0; transform: translate(-50%, -10px); pointer-events: none; }
    body.hidden-ui #toggle .hide { display: none; }
    body.hidden-ui #toggle .show { display: block; }
    body.hidden-ui .panel { transform: translateY(calc(100% + 24px)); opacity: 0; pointer-events: none; }
    body.hidden-ui #viseme { opacity: 0; transform: translateY(-10px); }
  }

  /* HP landscape: panel di kanan, karakter di sisa ruang kiri */
  @media (orientation: landscape) and (max-height: 520px) {
    .panel { left: auto; right: calc(12px + var(--safe-r)); top: calc(72px + var(--safe-t)); width: 340px; max-height: calc(100dvh - 84px - var(--safe-t) - var(--safe-b)); }
    body:not(.hidden-ui) #mouth { width: calc(100vw - 364px - var(--safe-r)); }
    body.hidden-ui .panel { transform: translateX(calc(100% + 24px)); }
  }
</style>
</head>
<body>
<main>
  <section class="stage">
    <!-- data-focus: area artboard (x0 y0 x1 y1) yang dibuat memenuhi canvas: badan dari kepala sampai kaki -->
    <canvas id="mouth" data-focus="455 -30 1355 2590" data-focus-y="0.5" aria-label="Talking mouth animation"></canvas>
    <span id="viseme">viseme 0 · silence</span>
  </section>

  <section id="panel" class="panel">
    <h1>Talking Mouth</h1>
    <p class="lede">Type some text and the Rive mouth will say it. Press <kbd>⌘/Ctrl</kbd> + <kbd>Enter</kbd> to speak.</p>

    <textarea id="text" aria-label="Text to speak" spellcheck="false" enterkeyhint="send">Hello! My name is Mouth. I can say anything you type in here.</textarea>

    <div id="samples" aria-label="Sample text">
      <button type="button" data-text="Good morning, how are you today?">Good morning</button>
      <button type="button" data-text="Peter Piper picked a peck of pickled peppers.">Peter Piper</button>
      <button type="button" data-text="She sells seashells by the seashore.">Seashells</button>
      <button type="button" data-text="One, two, three, 45, 2026.">Numbers</button>
    </div>

    <details id="settings" open>
      <summary>Voice settings</summary>
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice"><option value="">Browser default voice</option></select>
      </div>
      <div class="field">
        <label for="rate">Speed</label>
        <input id="rate" type="range" min="0.5" max="1.6" step="0.1" value="1">
        <output id="rateOut" for="rate">1.0×</output>
      </div>
      <div class="field">
        <label for="pitch">Pitch</label>
        <input id="pitch" type="range" min="0.5" max="1.8" step="0.1" value="1">
        <output id="pitchOut" for="pitch">1.0</output>
      </div>
      <label class="check"><input id="mute" type="checkbox"> Mute (mouth movement only)</label>
    </details>

    <div class="bottom-row">
      <div class="actions">
        <button id="speak" type="button" disabled>Speak</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <button id="greet" type="button" disabled>👋 Greetings</button>
    </div>
    <p id="status" role="status">Loading…</p>
  </section>
</main>

<div id="view" role="group" aria-label="View">
  <button type="button" data-view="full" aria-pressed="true">Full body</button>
  <button type="button" data-view="close" aria-pressed="false">Close up</button>
</div>

<button id="toggle" type="button" aria-label="Hide controls" aria-expanded="true" aria-controls="panel">
  <svg class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  <svg class="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<script src="rive.js"></script>
<script src="visemes.js"></script>
<script src="app.js"></script>
<script>
  // Perilaku khusus tampilan mobile (harus sama dengan media query MOBILE di CSS)
  (function () {
    const mobile = matchMedia("(max-width: 760px), (orientation: landscape) and (max-height: 520px)");
    const btn = document.getElementById("toggle");
    const settings = document.getElementById("settings");
    const canvas = document.getElementById("mouth");
    const side = matchMedia("(orientation: landscape) and (max-height: 520px)");

    // Area artboard (x0 y0 x1 y1) per tampilan. focusY = letak tengah area di layar
    // (0 = atas, 1 = bawah); "panel" dipakai saat panel kontrol sedang tampil.
    const VIEWS = {
      full:  { focus: "455 -30 1355 2590", focusY: 0.5, panel: 0.5 },   // kepala sampai kaki
      close: { focus: "640 150 1130 850",  focusY: 0.5, panel: 0.38 },  // kepala + bahu
    };
    let view = "full";

    function applyView() {
      // Desktop selalu full body; pilihan tampilan hanya untuk mobile.
      const v = VIEWS[mobile.matches ? view : "full"];
      // panel di bawah (portrait) menutupi bagian bawah layar: naikkan wajah sedikit
      const panelShown = mobile.matches && !side.matches && !document.body.classList.contains("hidden-ui");
      canvas.dataset.focus = v.focus;
      canvas.dataset.focusY = String(panelShown ? v.panel : v.focusY);
      document.querySelectorAll("#view button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
      if (window.mouthApp) window.mouthApp.refit();
    }
    document.getElementById("view").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-view]");
      if (!b) return;
      view = b.dataset.view;
      try { localStorage.setItem("mouth.view", view); } catch (e) {}
      applyView();
    });
    try { if (VIEWS[localStorage.getItem("mouth.view")]) view = localStorage.getItem("mouth.view"); } catch (e) {}

    function setHidden(hidden) {
      document.body.classList.toggle("hidden-ui", hidden);
      btn.setAttribute("aria-expanded", String(!hidden));
      btn.setAttribute("aria-label", hidden ? "Show controls" : "Hide controls");
      if (hidden && document.activeElement) document.activeElement.blur();
      applyView();
    }
    btn.addEventListener("click", () => {
      const hidden = !document.body.classList.contains("hidden-ui");
      setHidden(hidden);
      try { localStorage.setItem("mouth.hiddenUI", hidden ? "1" : "0"); } catch (e) {}
    });

    // Desktop: panel selalu tampil, pengaturan terbuka. Mobile: pakai pilihan terakhir.
    function applyMode() {
      if (mobile.matches) {
        let saved = null;
        try { saved = localStorage.getItem("mouth.hiddenUI"); } catch (e) {}
        setHidden(saved === "1");
        settings.open = false;
      } else {
        setHidden(false);
        settings.open = true;
      }
    }
    mobile.addEventListener("change", applyMode);
    applyMode();

    // Mobile: Enter di keyboard = Speak (Shift+Enter tetap baris baru)
    document.getElementById("text").addEventListener("keydown", (e) => {
      if (mobile.matches && e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        e.target.blur();
        document.getElementById("speak").click();
      }
    });
  })();
</script>
</body>
</html>
